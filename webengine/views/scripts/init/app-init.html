<script>
  // ==================== IMAGE FALLBACK SYSTEM ====================
  (function() {
    // Only run on specific domain
    if (window.location.hostname !== '4xxglxlj-dev.preview.stage.zesty.io') return;

    // PREDEFINED FALLBACK IMAGE URL
    const FALLBACK_IMAGE = 'https://4xxglxlj.media.zestyio.com/stories-fallback-image.jpg?width=150'; 
    const FALLBACK_CC_LOGO = 'https://4xxglxlj.media.zestyio.com/Asset-2--1-.png?width=160';
    const FALLBACK_CC_LOGO_2 = 'https://4xxglxlj.media.zestyio.com/Frame-7.png?width=160&quality=60&format=webp'
    const FALLBACK_USER_IMAGE = 'https://www.gravatar.com/avatar/?d=mp';
    const FALLBACK_CC_HERO_IMAGE = 'https://4xxglxlj.media.zestyio.com/CC-Login-Image.png?width=800&quality=60&format=webp'

    function isValidUrl(url) {
        if (!url || url.trim() === '' || url === 'undefined' || url === 'null') return false;
        // Basic check: must have a protocol or start with /
        return /^(https?:\/\/|\/|data:)/.test(url);
    }

    function getFallbackUrl(img) {
        const type = img.getAttribute('data-image-type');
        if (type === 'cc_logo') return FALLBACK_CC_LOGO;
        if (type === 'cc_logo_2') return FALLBACK_CC_LOGO_2;
        if (type === 'user_image') return FALLBACK_USER_IMAGE;
        if (type === 'cc_hero_image') return FALLBACK_CC_HERO_IMAGE;
        return FALLBACK_IMAGE;
    }

    function fixImage(img) {
        const src = img.getAttribute('src');
        if (!isValidUrl(src)) {
            img.removeAttribute('srcset'); // Remove broken srcset
            img.src = getFallbackUrl(img);
        }
    }

    // 1. Initial scan for images already in the DOM
    document.querySelectorAll('img').forEach(fixImage);

    // 2. Global listener for broken images (network errors)
    // Use capture phase (true) because 'error' events on elements don't bubble
    window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'IMG') {
            const fallback = getFallbackUrl(e.target);
            // Check if current src is already the fallback to avoid infinite loops
            if (e.target.src !== window.location.origin + fallback && e.target.src !== fallback) {
                e.target.removeAttribute('srcset'); // Remove broken srcset on error
                e.target.src = fallback;
            }
        }
    }, true);

    // 3. MutationObserver to handle dynamically added images or attribute changes
    const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            if (mutation.type === 'childList') {
                mutation.addedNodes.forEach((node) => {
                    if (node.nodeType === 1) { // ELEMENT_NODE
                        if (node.tagName === 'IMG') {
                            fixImage(node);
                        } else {
                            node.querySelectorAll('img').forEach(fixImage);
                        }
                    }
                });
            } else if (mutation.type === 'attributes' && (mutation.attributeName === 'src' || mutation.attributeName === 'srcset')) {
                fixImage(mutation.target);
            }
        });
    });

    // Start observing immediately
    observer.observe(document.documentElement, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['src', 'srcset']
    });
  })();
</script>

<script type="module">
  // ==================== APP INITIALIZATION ====================

  // Initialize the app
  function initializeApp() {
    try {
      // Helper function to safely add event listener
      function addEventListenerIfExists(elementId, eventType, handler) {
        const element = document.getElementById(elementId);
        if (element) {
          element.addEventListener(eventType, handler);
        }
      }

      // Google sign-in button
      addEventListenerIfExists("google-signin-btn", "click", () => {
        localStorage.setItem("npoZuidToFollow", "{{$zuid}}");
        localStorage.setItem("invite_type", "{{$invite_type}}");
        localStorage.setItem("npoSlug", "{{$slug}}");
        window.signInWithGoogle();
      });

      // Facebook sign-in button
      addEventListenerIfExists("continue-with-fb-btn", "click", () => {
        localStorage.setItem("npoZuidToFollow", "{{$zuid}}");
        localStorage.setItem("invite_type", "{{$invite_type}}");
        localStorage.setItem("npoSlug", "{{$slug}}");
        window.signInWithFacebook();
      });

      // Microsoft sign-in button
      addEventListenerIfExists("microsoft-signin-btn", "click", () => {
        localStorage.setItem("npoZuidToFollow", "{{$zuid}}");
        localStorage.setItem("invite_type", "{{$invite_type}}");
        localStorage.setItem("npoSlug", "{{$slug}}");
        window.signInWithMicrosoft();
      });

      // Apple sign-in button
      addEventListenerIfExists("apple-signin-btn", "click", () => {
        localStorage.setItem("npoZuidToFollow", "{{$zuid}}");
        localStorage.setItem("invite_type", "{{$invite_type}}");
        localStorage.setItem("npoSlug", "{{$slug}}");
        window.signInWithApple();
      });
    } catch (error) {
      console.error("Error initializing app:", error);
    }

    firebase.auth().onAuthStateChanged(async (user) => {
      if (user) {
        await window.updateUserDataInLocalStorage(user.uid);
        // Initialize FCM for authenticated users
        setTimeout(() => {
          window.syncFCMToken();
        }, 2000); // Wait 2 seconds for Firebase messaging to be fully loaded
      } else {
        localStorage.removeItem("user");
        localStorage.removeItem("zestyUser");
        localStorage.removeItem("fcm_token_registered");
        localStorage.removeItem("fcm_device_id");
      }
      window.updateUIBasedOnAuthState(user);

      if (window.location.pathname !== "{{login_page.first().getUrl()}}" && !window.isAuthenticating) {
        window.handleRouting(user);
      } else if (
        window.location.pathname === "{{login_page.first().getUrl()}}" &&
        user &&
        !window.isAuthenticating
      ) {
        window.handleRouting(user);
      }
    });
  }

  $(document).ready(initializeApp);
</script>
