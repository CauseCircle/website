<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Cause Circle Feedback</title>

    <style>
       body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: #f3f4f6;
        display: flex;
        justify-content: center;
      }

      .wrapper {
        width: 100%;
        max-width: 360px;
        padding: 20px 16px 24px;
        box-sizing: border-box;
        text-align: center;
      }

      .header {
        font-size: 14px;
        margin-bottom: 16px;
      }

      .image {
        width: 150px;
        display: block;
      }

      .title {
        font-size: 24px;
        font-weight: 500;
        margin-bottom: 8px;
      }

      .message {
        font-size: 16px;
        font-weight: 400;
        margin-bottom: 20px;
        color: #525866;
        width: 270px;
        margin: 0 auto;
      }

      .form-group {
        width: 260px;
        margin: 20px auto 12px;
        text-align: left;
      }

      label {
        font-size: 14px;
        font-weight: 500;
        display: block;
        margin-bottom: 6px;
      }

      .required {
        color: red;
      }

      textarea {
        width: 100%;
        height: 86px;
        border-radius: 6px;
        border: 1px solid #ccc;
        padding: 10px;
        font-family: "Inter", sans-serif;
        font-size: 14px;
        resize: none;
        box-sizing: border-box;
        display: block;
      }

      button {
        width: 260px;
        height: 44px;
        border-radius: 6px;
        border: none;
        background-color: #7d52f4;
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        font-family: "Inter", sans-serif;
        cursor: pointer;
        display: block;
        margin: 20px auto;
        box-sizing: border-box;
      }

      .terms {
        margin-top: 16px;
        font-size: 12px;
        font-weight: 500;
        color: #000000;
        text-align: center;
        width: 260px;
        margin: 16px auto;
      }

      .terms-underline {
        text-decoration: underline;
      }

      .top-section {
        background: #ffffff;
        width: 100%;
        height: 50px;
        display: flex;
        justify-content: center; 
        align-items: center;    
        margin-bottom: 50px;
      }

    </style>
  </head>
  <body>
    <div class="wrapper">
     <div class="top-section">
        <img src="https://4xxglxlj.media.zestyio.com/cause-circle-logo-light.png" alt="Center Image" class="image" />
      </div>

      <div class="title">Share your story</div>
      <div class="message">
        Tell the world how NPO made an impact on you, your community, or
        those around you.
      </div>

      <form>
        <div class="form-group">
          <label>Post<span class="required">*</span></label>
          <textarea placeholder="" required></textarea>
        </div>

        <button type="submit">Create Account & Post</button>
      </form>

      <div class="terms">
        By continuing you agree to CauseCircle’s
        <span class="terms-underline">Terms and Conditions</span> and
        <span class="terms-underline">Privacy Policy</span>
      </div>
    </div>
  </body>

  <script>
    const npoValue =
      new URLSearchParams(window.location.search).get("NPO") ||
      "your organization";
    document.getElementById(
      "message-text"
    ).textContent = `Tell the world how ${npoValue} made an impact on you, your community, or those around you.`;
  </script>
  
</html>
