<section id="orgDetails" class="container d-none">
  <div
    class="header-container d-flex justify-content-between align-items-center p-4 position-relative"
  >
    <button class="prevBtn btn btn-link p-0 border-0 text-decoration-none" style="color: #525866">
      <i class="bi bi-arrow-left fs-3 d-none d-md-inline"></i>
      <span class="d-md-none fs-6 fw-medium">Back</span>
    </button>

    <div class="position-absolute top-50 start-50 translate-middle">
      <img
        src="{{ globals.logo.getImage() }}"
        style="max-width: 160px"
        alt="cause circle brand logo"
        data-image-type="cc_logo"
      /> 
    </div>
  </div>
  <div class="py-4 mt-4">
    <div
      class="d-flex flex-column gap-2 justify-content-center align-items-center"
    >
      <div
        class="p-3 rounded-circle d-flex align-items-center justify-content-center border"
        style="background-color: white; width: 90px; height: 90px; border-color: #efebff !important; border-width: 13px !important"
      >
        <i class="bi bi-building" style="font-size: 32px; color: #525866"></i>
      </div> 
      <div class="d-flex flex-column gap-2 align-items-center">
        <p class="fs-4 fw-semibold mb-0">Add your organization details</p>
        <p class="fs-6 text-muted mb-0">Create your org profile</p>
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-center align-items-center flex-column">
    <div class="mb-4" style="width: 380px">
      <div class="d-flex flex-column gap-3">
        <div class="form-group">
          <label for="npoName" class="form-label">Nonprofit name <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            id="npoName"
            placeholder="Your NPO"
            required
          />
        </div>
        <div class="form-group">
          <label for="npoDescription" class="form-label">Short Description <span class="text-danger">*</span></label>
          <textarea
            class="form-control"
            id="npoDescription"
            placeholder="Add a short description about your organization"
            rows="4"
            maxlength="200"
            required
          ></textarea>
          <div class="text-end mt-1">
            <small class="text-muted">
              <span id="descriptionCharCount">0</span>/200
            </small>
          </div>
        </div>
        <div class="form-group">
          <label for="causeAreaInput" class="form-label">Cause area <span class="text-danger">*</span></label>
          <div class="dropdown" style="position: relative;">
            <input
              type="text"
              class="form-control"
              id="causeAreaInput"
              placeholder="Choose one"
              autocomplete="off"
              readonly
              value=""
              style="padding-right: 40px;"
            />
            <i class="bi bi-chevron-down position-absolute" style="right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #6c757d;"></i>
            <ul
              class="dropdown-menu w-100"
              id="causeAreaDropdown"
              style="max-height: 300px; overflow-y: auto"
            >
              <!-- Causes will be populated here -->
            </ul>
          </div>
          <input
            type="hidden"
            id="causeArea"
            name="causeArea"
            value=""
          />
        </div>
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="adminTerms"
            required
          />
          <label class="form-check-label" for="adminTerms">
            I agree to the <a href="{{admin_terms.first().getUrl()}}" target="_blank"><u>Admin Terms</u></a>
          </label>
        </div>
      </div>
      <button class="nextBtn btn btn-primary w-100 mt-4" disabled>Next</button>
    </div>
  </div>
</section>

<script type="module">
  $(document).ready(function() {
    // Function to validate all required fields
    function validateForm() {
      const npoName = $('#orgDetails #npoName').val().trim();
      const npoDescription = $('#orgDetails #npoDescription').val().trim();
      const causeArea = $('#orgDetails #causeArea').val();
      const adminTermsChecked = $('#orgDetails #adminTerms').is(':checked');
      
      // Enable Next button only if all required fields are filled
      const isValid = npoName !== '' && 
                      npoDescription !== '' && 
                      causeArea !== '' && 
                      adminTermsChecked;
      
      $('#orgDetails .nextBtn').prop('disabled', !isValid);
    }
    
    // Add event listeners to all required fields
    $('#orgDetails #npoName').on('input', validateForm);
    $('#orgDetails #npoDescription').on('input', validateForm);
    $('#orgDetails #causeArea').on('change', validateForm);
    $('#orgDetails #adminTerms').on('change', validateForm);
    
    // Initial validation on page load
    validateForm();
  });
</script>
