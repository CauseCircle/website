<section id="npoSelection" class="container d-none">
  <div
    class="header-container d-flex justify-content-between align-items-center p-4 position-relative"
  >
    <button class="prevBtn btn btn-link p-0 border-0 text-decoration-none" style="color: #525866">
      <i class="bi bi-arrow-left fs-3 d-none d-md-inline"></i>
      <span class="d-md-none fs-6 fw-medium">Back</span>
    </button>

    <div class="position-absolute top-50 start-50 translate-middle">
      <img
        src="{{ globals.logo.getImage() }}"
        style="max-width: 160px"
        alt="cause circle brand logo"
        data-image-type="cc_logo"
      />
    </div>

    <div class="d-flex align-items-center gap-3">
      <button
        class="skipBtn btn btn-link p-0 border-0 text-decoration-none" 
        style="color: #525866"
      >
        Skip
      </button>
      <button class="nextBtn btn btn-primary selectedNPOs-btn d-none">Save</button>
    </div>
  </div>
  <div class="py-4">
    <div
      class="d-flex flex-column gap-2 justify-content-center align-items-center"
    >
      <img
        src="https://4xxglxlj.media.zestyio.com/subscribe-npo.png"
        style="max-width: 90px"
      />
      <div class="d-flex flex-column gap-2 align-items-center">
        <p class="fs-4 fw-semibold mb-0">Subscribe to nonprofits</p>
        <p class="fs-6 text-muted mb-0 text-center">
          Choose which nonprofits you want to follow
        </p>
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-center align-items-center flex-column mt-4">
    <div class="mb-4" style="width: 380px">
      <label for="causeFilterInput" class="form-label">Filter by cause area</label>
      <div class="dropdown mb-3" style="width: 380px; position: relative;">
        <input
          type="text"
          class="form-control"
          id="causeFilterInput"
          placeholder="Choose one"
          autocomplete="off"
          readonly
          value="Choose one"
          style="padding-right: 40px;"
        />
        <i class="bi bi-chevron-down position-absolute" style="right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #6c757d;"></i>
        <ul
          class="dropdown-menu w-100"
          id="causeFilterDropdown"
          style="max-height: 160px; overflow-y: auto"
        >
          <!-- Causes will be populated here -->
        </ul>
      </div>
      <input
        type="hidden"
        id="selectedCauseZuids"
        name="selectedCauseZuids"
        value=""
      />
      <div id="npo-loading" class="text-center d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      <div
        id="npo-container"
        class="d-flex flex-column gap-3 overflow-auto w-100"
        style="max-height: 450px"
      ></div>
    </div>
  </div>
</section>
